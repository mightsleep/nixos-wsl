name: Release

# Push a tag like v2026.10.21 and get a ready nixos.wsl in the release
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - name: Build nixos.wsl
        run: |
          nix build .#nixosConfigurations.wsl.config.system.build.tarballBuilder
          sudo ./result/bin/nixos-wsl-tarball-builder nixos.wsl
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" nixos.wsl --generate-notes
