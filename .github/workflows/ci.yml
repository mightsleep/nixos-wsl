name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      - uses: cachix/install-nix-action@v31.11.2
      - name: Lint and build the system
        run: nix build --keep-going --print-build-logs .#checks.x86_64-linux.lint .#checks.x86_64-linux.toplevel
